x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:

  prometheus:
    <<: *default-logging
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=15GB
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
      - --query.timeout=2m
      - --query.max-concurrency=20
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./file_sd:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - alertmanager

  grafana:
    <<: *default-logging
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://monitoring.basantkumawat.com}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: ${GRAFANA_HSTS:-false}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_ENABLED: "false"
      GF_EXPLORE_ENABLED: "true"
      GF_METRICS_ENABLED: "true"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      # Default landing page (Home icon) — enterprise overview dashboard
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/dogpackapp-home.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # CloudWatch datasource: uses EC2 instance IAM role (authType default).
      # Requires IAM role on this host + IMDS hop limit 2 for Docker. See scripts/verify-cloudwatch-grafana.sh
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SDK_LOAD_CONFIG: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

  tempo:
    <<: *default-logging
    image: grafana/tempo:2.4.2
    container_name: tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s

  loki:
    <<: *default-logging
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yaml
      - -target=all
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  alertmanager:
    <<: *default-logging
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed "s|__SLACK_WEBHOOK_URL__|$$SLACK_WEBHOOK_URL|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  blackbox:
    <<: *default-logging
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox
    restart: unless-stopped
    command:
      - --config.file=/config/blackbox.yml
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro
    ports:
      - "9115:9115"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9115/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ships Docker container logs (this host + compose stack) to Loki.
  promtail:
    <<: *default-logging
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    environment:
      PROMTAIL_ENVIRONMENT: ${PROMTAIL_ENVIRONMENT:-Staging}
      PROMTAIL_HOST: ${PROMTAIL_HOST:-monitoring}
      PROMTAIL_SERVICE_JOB: ${PROMTAIL_SERVICE_JOB:-monitoring-stack}
      PROMTAIL_INSTANCE_ID: ${PROMTAIL_INSTANCE_ID:-monitoring}
    volumes:
      - ./promtail/docker-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 256m

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  promtail-positions:
