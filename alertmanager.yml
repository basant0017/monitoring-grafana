global:
  resolve_timeout: 5m

route:
  receiver: "team-alerts"
  group_by: ["alertname", "environment", "severity", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "team-alerts"
    slack_configs:
      - api_url: "__SLACK_WEBHOOK_URL__"
        channel: "#alerts"
        send_resolved: true
        title: >-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
          {{ .CommonLabels.alertname }}
        text: |-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          *env:* `{{ .Labels.environment }}`  *severity:* `{{ .Labels.severity }}`  *instance:* `{{ .Labels.instance }}`
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["instance", "alertname"]
