# Local dev: PM2 + Docker logs (used by docker-compose.override.yml).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pm2-stdout
    static_configs:
      - targets: [localhost]
        labels:
          job: pm2
          environment: Staging
          host: local-dev
          stream: stdout
          __path__: /pm2logs/*-out*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '.*/(?P<app>[^/]+?)-out(?:-\d+)?\.log'
      - labels:
          app:

  - job_name: pm2-stderr
    static_configs:
      - targets: [localhost]
        labels:
          job: pm2
          environment: Staging
          host: local-dev
          stream: stderr
          __path__: /pm2logs/*-error*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '.*/(?P<app>[^/]+?)-error(?:-\d+)?\.log'
      - labels:
          app:
      - static_labels:
          level: error

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - target_label: job
        replacement: docker
      - target_label: environment
        replacement: Staging
      - target_label: host
        replacement: local-dev

